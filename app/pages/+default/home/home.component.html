<div tooltip="toto je test">Home page</div>
<debug-data [copyClick]="'a toto sa skopirovalo'">
    <div>debug - toto sa kopiruje</div>
</debug-data>

<div>
    <button type="button" class="btn btn-primary" (click)="showError()">
        <span>error</span>
    </button>
    <button type="button" class="btn btn-primary" (click)="showWarn()">
        <span>warn</span>
    </button>
    <button type="button" class="btn btn-primary" (click)="showDefault()">
        <span>default</span>
    </button>
    <button type="button" class="btn btn-primary" (click)="showInfo()">
        <span>info</span>
    </button>
    <button type="button" class="btn btn-primary" (click)="showSuccess()">
        <span>success</span>
    </button>
</div>

<div>
    <button type="button" class="btn btn-primary" (click)="localShowError()">
        <span>local error</span>
    </button>
    <button type="button" class="btn btn-primary" (click)="localShowWarn()">
        <span>local warn</span>
    </button>
    <button type="button" class="btn btn-primary" (click)="localShowDefault()">
        <span>local default</span>
    </button>
    <button type="button" class="btn btn-primary" (click)="localShowInfo()">
        <span>local info</span>
    </button>
    <button type="button" class="btn btn-primary" (click)="localShowSuccess()">
        <span>local success</span>
    </button>
</div>

<div class="flex-row">
    <div class="flex-1" >
        <notifications withProvider="test"></notifications>
    </div>

    <div class="flex-1">
        <notifications></notifications>
    </div>
</div>
